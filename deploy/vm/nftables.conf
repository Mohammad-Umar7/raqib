#!/usr/sbin/nft -f
# Raqib sandbox VM firewall: the browser may reach the public web and nothing private.
# Enforced at the IP layer, so redirects, WebSockets, WebRTC and DNS rebinding cannot reach private addresses either.
flush ruleset

table inet raqib {
  set private4 {
    type ipv4_addr
    flags interval
    elements = { 0.0.0.0/8, 10.0.0.0/8, 100.64.0.0/10, 127.0.0.0/8, 169.254.0.0/16, 172.16.0.0/12, 192.0.0.0/24, 192.0.2.0/24,
                 192.168.0.0/16, 198.18.0.0/15, 198.51.100.0/24, 203.0.113.0/24, 224.0.0.0/4, 240.0.0.0/4 }
  }
  set resolvers4 {
    type ipv4_addr
    elements = { 1.1.1.1, 8.8.8.8 }
  }

  chain input {
    type filter hook input priority filter; policy drop;
    iif lo accept
    ct state established,related accept
    ct state invalid drop
    # SSH and the dashboard, only through VirtualBox port forwarding (which arrives from the NAT gateway)
    ip saddr 10.0.2.2 tcp dport { 22, 8600 } accept
    icmp type { destination-unreachable, time-exceeded } accept
  }

  chain output {
    type filter hook output priority filter; policy drop;
    oif lo accept
    ct state established,related accept
    ct state invalid drop
    meta nfproto ipv6 limit rate 30/minute log prefix "raqib-drop-ipv6 "
    meta nfproto ipv6 counter drop
    ip daddr @private4 limit rate 30/minute log prefix "raqib-drop-private "
    ip daddr @private4 counter drop
    ip daddr @resolvers4 meta l4proto { tcp, udp } th dport 53 accept
    udp dport 123 accept
    tcp dport { 80, 443 } accept
    limit rate 30/minute log prefix "raqib-drop-other "
    counter drop
  }

  chain forward {
    type filter hook forward priority filter; policy drop;
  }
}
